name: 🚀 Nutanix DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Build Docker Image
        run: docker build -t nutanix-app ./app

      - name: 🚀 Run Container
        run: docker run -d -p 5000:5000 nutanix-app

      - name: ⏳ Wait for App
        run: sleep 5

      - name: ✅ Health Check
        run: curl http://localhost:5000